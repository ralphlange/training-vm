# defaults for phoebus
---
phoebus_version: v6.0.0

phoebus_launcher: "/opt/epics-tools/lib/phoebus/phoebus-product/phoebus.sh"
phoebus_owner: "root"
force_gpu: false

# JAVA options
phoebus_java_initial_heapsize: "256M"
phoebus_java_max_heapsize: "1024M"
phoebus_java_heap_tuning_opts: "-XX:MaxHeapFreeRatio=10 -XX:MinHeapFreeRatio=5 -XX:-ShrinkHeapInSteps"

mvn_version: 3.9.14
mvn_home: "/opt/epics-tools/lib/apache-maven"

epics_services_account: root

# Archiver Appliance retrieval service used by the Data Browser
# (only configured when the archiver_appliance role is enabled)
archiver_host: localhost
archiver_retrieval_port: 17665

# Documentation build: virtualenv location, and the distro's Python package
# to use where the system python3 is older than 3.11 (Rocky 9, Ubuntu 22.04)
phoebus_docs_src: "/opt/epics-tools/lib/phoebus/docs"
phoebus_docs_venv: "/opt/epics-tools/lib/phoebus-docs-venv"
phoebus_docs_python_fallback: >-
  {{ 'python3.12' if is_redhat else 'python3.11' }}
