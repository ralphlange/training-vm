---
# variables for oac_tree

oactree_install_path: "/opt/oac-tree"

oactree_bundle_repo: "https://github.com/oac-tree/oac-tree-bundle.git"
oactree_bundle_version: "v1.6"

required_debs:
  - cmake
  - git
  # Not needed for building (unit tests are disabled), but sup-mvvm's
  # installed package config unconditionally does find_dependency(GTest),
  # so anything using sup-mvvm (sup-gui-core, oac-tree-gui) needs it.
  - libgtest-dev
  - libgmock-dev
  - libxml2-dev
  # oac-tree-server (since v2.7, bundle v1.6): standalone Asio headers
  # and OpenSSL for its websocket server
  - libasio-dev
  - libssl-dev
  - qt6-base-dev
  - qt6-svg-dev
  - qt6-charts-dev
  - qt6-tools-dev
  - adwaita-qt6

required_rpms:
  - cmake
  - git
  # Not needed for building (unit tests are disabled), but sup-mvvm's
  # installed package config unconditionally does find_dependency(GTest),
  # so anything using sup-mvvm (sup-gui-core, oac-tree-gui) needs it.
  - gtest-devel
  - gmock-devel
  - libxml2-devel
  # oac-tree-server (since v2.7, bundle v1.6): standalone Asio headers
  # (EPEL on Rocky) and OpenSSL for its websocket server
  - asio-devel
  - openssl-devel
  - qt6-qtbase-devel
  - qt6-qtsvg-devel
  - qt6-qtcharts-devel
  - qt6-qttools-devel
