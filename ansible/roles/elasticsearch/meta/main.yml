---
# galaxy_info is required by Molecule's prerun (role name check)
galaxy_info:
  role_name: elasticsearch
  namespace: epics
  author: Ralph Lange
  description: Elasticsearch (single node) for the Phoebus alarm logger
  license: EPICS open license
  min_ansible_version: "2.15"
# Elasticsearch runs on the JDK bundled in its release archive
# (the version it is tested with), so it has no dependency on the java role
dependencies: []
