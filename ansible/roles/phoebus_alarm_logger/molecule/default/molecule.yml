---
dependency:
  name: galaxy
lint: |
  set -e
  yamllint .
  ansible-lint
  flake8
provisioner:
  name: ansible
  playbooks:
    converge: ../resources/converge.yml
  inventory:
    host_vars:
      phoebus-alarm-logger-systemd:
        # Real systemd in the container: run the services as on a VM
        in_container: false
    group_vars:
      all:

scenario:
  name: default
verifier:
  name: testinfra
  directory: ../resources/tests/
driver:
  name: docker
# Container with systemd as PID 1 (shared image definition in ansible/molecule/systemd)
platforms:
  - name: phoebus-alarm-logger-systemd
    image: ubuntu:22.04
    # relative to the scenario directory
    dockerfile: ../../../../molecule/systemd/Dockerfile.j2
    pre_build_image: false
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
