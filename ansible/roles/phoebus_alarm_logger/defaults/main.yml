---
# Defaults for the Phoebus alarm logger
#
# Modelled on the alarm logger part of the phoebus_services_phoebus_alarm role
# of https://github.com/ControlSystemStudio/ansible-phoebus
#
# The alarm logger is built by the phoebus role (Phoebus' top-level Maven
# build includes services/), so this role only runs the already-built
# service. It reads the alarm messages from Kafka and stores them in
# Elasticsearch (elasticsearch role, a dependency); its REST API serves the
# Phoebus "Alarm Log" table. alarm_config_name, alarm_kafka_server and
# alarm_logger_url live in group_vars/all.yml, because the phoebus role
# needs them too (client preferences).

alarm_logger_user: alarm-logger
alarm_logger_group: alarm-logger
alarm_logger_home: "/var/lib/alarm-logger"
alarm_logger_target_dir: "/opt/epics-tools/lib/phoebus/services/alarm-logger/target"
alarm_logger_java_heap_opts: "-Xms128M -Xmx512M"

# Comma-separated list of alarm configurations (topics) to log
alarm_logger_topics: "{{ alarm_config_name }}"

# Port of the REST API - taken from the URL the Phoebus client uses
alarm_logger_port: "{{ alarm_logger_url | urlsplit('port') }}"

alarm_logger_es_host: "{{ elasticsearch_listen_host }}"
alarm_logger_es_port: "{{ elasticsearch_http_port }}"
