---
# Functional test of the Archiver Appliance together with the Phoebus Data
# Browser configuration. Unlike the other scenarios, this one needs real
# services (MariaDB, Tomcat), so it runs a systemd container (privileged)
# with in_container: false.
dependency:
  name: galaxy
lint: |
  set -e
  yamllint .
  ansible-lint
  flake8
provisioner:
  name: ansible
  playbooks:
    converge: ../resources/converge.yml
  inventory:
    host_vars:
      archiver-appliance-docker:
        in_container: false
        docker: true
        install_gnome: false
        install_graphics: false
        phoebus: true
        archiver_appliance: true
    group_vars:
      all:

scenario:
  name: default
verifier:
  name: testinfra
  directory: ../resources/tests/
driver:
  name: docker
platforms:
  - name: archiver-appliance-docker
    image: ubuntu:22.04
    dockerfile: ../resources/Dockerfile.j2
    pre_build_image: false
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
